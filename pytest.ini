[pytest]
minversion = 8.0
testpaths = tests/unit
pythonpath = src
addopts = -m "not property and not integration and not regression and not slow"
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: component workflows / external interfaces, explicitly selected
    regression: training, checkpoints, reporting and other costly preserved checks
    property: testy własnościowe (property-based) realizowane przy użyciu Hypothesis (Wymaganie 11)
    slow: testy kosztowne obliczeniowo (np. determinizm treningu GAN - Property 14, 15)
