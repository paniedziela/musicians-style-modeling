[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musicians-style"
version = "0.1.0"
description = "Modelowanie stylu artystycznego muzyków - transfer stylu pomiędzy plikami MIDI (StarGAN/CycleGAN + algorytm genetyczny)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Praca inżynierska - Wydział ETI, Politechnika Gdańska" },
]
keywords = ["midi", "style-transfer", "gan", "cyclegan", "stargan", "genetic-algorithm", "music"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

# Dokładne wersje zależności - Wymaganie 8.5 (reprodukowalność).
dependencies = [
    "torch==2.2.2+cu121",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "scikit-learn==1.5.1",
    "mido==1.3.2",
    "pretty_midi==0.2.10",
    "structlog==24.1.0",
    "PyYAML==6.0.1",
    "matplotlib==3.8.4",
    "pyFluidSynth==1.3.3",
    "yt-dlp==2024.8.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "hypothesis==6.103.2",
]

[project.scripts]
midi-style = "musicians_style.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# Uwaga: konfiguracja pytest (markery, testpaths) znajduje się w pliku `pytest.ini`,
# który jest jednym źródłem prawdy zgodnie z poleceniem zadania 1.1.
